name: E1 AWI CMIP6 v4.4 sparse multiyear daily pairing audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-awi-multiyear-v1.txt'

permissions:
  contents: read

concurrency:
  group: e1-cmip6-awi-multiyear-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source readers and test cohort isolation
        run: |
          python -m pip install "numpy" "xarray" "zarr<4" "gcsfs" "cftime" "pytest"
          python -m pytest tests/test_cmip6_awi_daily_pairs.py tests/test_cmip6_awi_multiyear_cohort.py
      - name: Read predeclared 312 AWI native-calendar daily pairs across historical and SSPs
        run: |
          python scripts/audit_cmip6_awi_multiyear_cohort.py \
            --manifest experiments/cmip6_v40_first_two_catalog_triples.json \
            --output outputs/e1_cmip6_v44_awi_multiyear_audit.json
      - name: Check full pilot schedule and no SSP leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/e1_cmip6_v44_awi_multiyear_audit.json').read_text())
          assert d['status']=='v44_sparse_multiyear_data_audit_no_neural_forecasting'
          assert d['n_pairs_total']==312
          assert d['schedule']['train_years']==[1980,1990,2000,2004]
          assert d['schedule']['validation_years']==[2005,2010,2014]
          assert d['schedule']['ssp_test_years']==[2030,2050,2080]
          assert set(d['experiments'])=={'historical','ssp245','ssp585'}
          assert [d['experiments'][k]['n_pairs'] for k in ('historical','ssp245','ssp585')]==[168,72,72]
          assert d['experiments']['historical']['per_fold_counts']=={'train':96,'validation':72}
          assert all(d['experiments'][e]['per_fold_counts']=={'future_test':72}
                     for e in ('ssp245','ssp585'))
          assert len({tuple(x['regional_grid_shape']) for x in d['experiments'].values()})==1
          assert len({x['calendar'] for x in d['experiments'].values()})==1
          assert all(x['finite_sampled_grids'] and not x['raw_data_archived']
                     for x in d['experiments'].values())
          print('All 312 sparse native-calendar AWI pilot pairs audited, no SSP fitting.')
          PY
      - name: Archive diagnostics only (no raw CMIP6 temperature tensors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-cmip6-v44-awi-multiyear-sparse-cohort
          path: outputs/e1_cmip6_v44_awi_multiyear_audit.json
          retention-days: 30
          if-no-files-found: warn
