name: E1 AWI-CMIP6 true +1-day western US regional pair feasibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-awi-regional-v1.txt'

permissions:
  contents: read

concurrency:
  group: e1-cmip6-awi-regional-v1
  cancel-in-progress: false

jobs:
  regional-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded source readers and test native-calendar/day pairing
        run: |
          python -m pip install "numpy" "xarray" "zarr<4" "gcsfs" "cftime" "pytest"
          python -m pytest tests/test_cmip6_awi_daily_pairs.py tests/test_cmip6_catalog.py
      - name: Read six AWI regional +1 day source/target pairs
        run: |
          python scripts/audit_cmip6_awi_daily_pairs.py \
            --manifest experiments/cmip6_v40_first_two_catalog_triples.json \
            --output outputs/e1_cmip6_v43_awi_daily_pairs.json
      - name: Validate AWI regional scientific identity without claiming forecast skill
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/e1_cmip6_v43_awi_daily_pairs.json').read_text())
          assert d['status']=='small_real_awi_daily_pair_preflight_not_training_or_future_skill'
          assert d['model']=='AWI-CM-1-1-MR'
          assert d['target_definition']=='tas_daily_mean_at_t_to_t_plus_one_native_day'
          assert set(d['scenarios'])=={'historical','ssp245','ssp585'}
          assert len({tuple(x['regional_grid_shape']) for x in d['scenarios'].values()})==1
          for scenario,data in d['scenarios'].items():
              assert len(data['pairs'])==2
              assert data['raw_temperature_grids_archived'] is False
              for pair in data['pairs']:
                  assert pair['sampled_cells_finite']
                  assert 16<=pair['n_cells']<=1600
                  assert 150<=pair['source_min_K']<=pair['source_max_K']<=350
                  assert 150<=pair['target_min_K']<=pair['target_max_K']<=350
          print('Native one-day AWI regional pairs validated for all three experiments.')
          PY
      - name: Archive regional metadata and descriptive tiny pilot only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-cmip6-v43-awi-native-daily-regional-pairs
          path: outputs/e1_cmip6_v43_awi_daily_pairs.json
          retention-days: 30
          if-no-files-found: warn
