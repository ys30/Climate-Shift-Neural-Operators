name: E1 CMIP6 daily tas historical-to-SSP catalog feasibility audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-catalog-v1.txt'

permissions:
  contents: read

concurrency:
  group: e1-cmip6-catalog-audit-v1
  cancel-in-progress: false

jobs:
  catalog-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test CMIP6 metadata pairing without heavy model dependencies
        run: |
          python -m pip install pytest
          python -m pytest tests/test_cmip6_catalog.py
      - name: Audit actual public Pangeo CMIP6 cloud catalog
        run: |
          python scripts/audit_cmip6_catalog.py \
            --output outputs/e1_cmip6_day_tas_manifest.json \
            --max-models 8
      - name: Validate strict catalog-only eligibility and scientific blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/e1_cmip6_day_tas_manifest.json').read_text())
          assert d['status']=='catalog_metadata_only_no_climate_fields_or_transfer_skill'
          assert d['variables']==['tas']
          assert d['table_id']=='day'
          assert d['matching_model_members'] >= len(d['selected_candidates']) >= 1
          assert len({x['source_id'] for x in d['selected_candidates']})==len(d['selected_candidates'])
          for row in d['selected_candidates']:
              for scenario in ('historical','ssp245','ssp585'):
                  assert row[scenario]['store'].startswith('gs://cmip6/')
              assert row['historical']['activity_id']=='CMIP'
              assert row['ssp245']['activity_id']=='ScenarioMIP'
              assert row['ssp585']['activity_id']=='ScenarioMIP'
          assert len(d['catalog_sha256'])==64
          print('Historical/SSP/day-tas identity audit PASS; field-level checks remain unverified.')
          PY
      - name: Archive public metadata manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-cmip6-day-tas-metadata-audit
          path: outputs/e1_cmip6_day_tas_manifest.json
          if-no-files-found: warn
          retention-days: 30
