name: E1 v5.17 CAMS independent Historical-only FNO U-Net frozen arms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v517-cams-arms-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v517-cams-historical-arms
  cancel-in-progress: false

jobs:
  train-cams:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tail_weight: [0, 1, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native CMIP6 training dependencies and verify no-SSP gates
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_cmip6_v517_cams_historical_arms.py tests/test_cmip6_v516_cams_historical.py
      - name: Download verified CAMS Historical-only 1140 pair artifact
        uses: actions/download-artifact@v4
        with:
          name: e1-v516-cams-native-historical-only-training-data
          run-id: 45900398047
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/processed
      - name: Preflight source SHA, native coordinate arrays and no SSP contamination
        run: |
          python - <<'PY'
          from scripts.run_cmip6_v517_cams_historical_arms import validate_source
          from pathlib import Path
          p=Path('data/processed/e1_cmip6_v516_cams_historical.npz')
          d=validate_source(p,p.with_suffix('.json'))
          assert d["shape"][0]>=4 and d["shape"][1]>=4
          assert d["train"].sum()==900 and (~d["train"]).sum()==240
          print("Original CAMS native historical SHA verified before any training:",d["digest"])
          PY
      - name: Train three fixed seeds for both original architectures with Historical-only checkpoints
        run: |
          python -m scripts.run_cmip6_v517_cams_historical_arms \
            --input data/processed/e1_cmip6_v516_cams_historical.npz \
            --metadata data/processed/e1_cmip6_v516_cams_historical.json \
            --output-dir outputs/e1_v517_cams_weight_${{ matrix.tail_weight }} \
            --tail-weight ${{ matrix.tail_weight }}
      - name: Validate six model checkpoints per arm, full source provenance and metrics
        run: |
          python - <<'PY'
          import json,math,hashlib
          from pathlib import Path
          from scripts.run_cmip6_v517_cams_historical_arms import STATUS
          w=${{ matrix.tail_weight }}
          p=Path(f'outputs/e1_v517_cams_weight_{w}')
          r=json.loads((p/'cams_arm_summary.json').read_text())
          assert r['status']==STATUS and r['epochs']==100 and r['seeds']==[11,22,33]
          assert r['tail_weight']==w and r['ssp_fields_read'] is False
          assert r['future_checkpoint_selection'] is False
          assert set(r['models'])=={'fno','unet'}
          all_shas=[]
          for model in r['models'].values():
            assert len(model['checkpoints'])==3
            for x in model['checkpoints']:
              ck=p/x['checkpoint']
              assert ck.is_file() and hashlib.sha256(ck.read_bytes()).hexdigest()==x['sha256']
              all_shas.append(x['sha256'])
            for name in ('weighted_rmse_K','local_p95_recall','local_p95_precision'):
              assert len(model[name]['individual'])==3
              assert all(math.isfinite(v) for v in model[name]['individual'])
          assert len(set(all_shas))==6
          print('CAMS Historical-only immutable checkpoints audited:',len(all_shas))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v517-cams-historical-frozen-weight-${{ matrix.tail_weight }}
          path: outputs/e1_v517_cams_weight_${{ matrix.tail_weight }}/
          retention-days: 30
          if-no-files-found: warn
