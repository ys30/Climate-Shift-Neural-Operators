name: E1 v5.19 three-GCM frozen SSP forecast comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v519-three-gcm-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v519-three-GCM
  cancel-in-progress: false

jobs:
  three-gcm-ssp-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 3-GCM source integrity and original matched Persistence
        run: |
          python -m pip install pytest
          python -m pytest tests/test_cmip6_v519_three_gcm_ssp.py
      - name: Retrieve original AWI Historical-frozen SSP scores
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v48-first-frozen-ssp-sparse-evaluation
          run-id: 45864317174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/awi
      - name: Retrieve original BCC Historical-frozen SSP scores
        uses: actions/download-artifact@v4
        with:
          name: e1-v54-bcc-first-frozen-ssp-results
          run-id: 45872811683
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/bcc
      - name: Retrieve real CAMS Historical-frozen SSP scores
        uses: actions/download-artifact@v4
        with:
          name: e1-v518-third-gcm-CAMS-frozen-SSP-forecast-scores
          run-id: 45905955958
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/cams
      - name: Compare 3 GCM and 2 SSP, 36 fixed neural arms
        run: |
          python -m scripts.audit_cmip6_v519_three_gcm_ssp \
            --awi inputs/awi/e1_cmip6_v48_frozen_ssp_evaluation.json \
            --bcc inputs/bcc/e1_cmip6_v54_bcc_frozen_ssp.json \
            --cams inputs/cams/e1_cmip6_v518_cams_frozen_ssp.json \
            --json-output outputs/e1_cmip6_v519_three_GCM_frozen_SSP.json \
            --csv-output outputs/e1_cmip6_v519_three_GCM_frozen_SSP.csv
      - name: Enforce independent GCM cluster counts, no future fitting
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open("outputs/e1_cmip6_v519_three_GCM_frozen_SSP.json"))
          assert d["status"]=="v519_three_independent_GCM_frozen_sparse_SSP_audit"
          assert d["ssp_used_for_checkpoint_selection"] is False
          assert d["independent_GCM_count"]==3 and d["scenario_cells"]==6
          assert len(d["arms"])==36 and len(d["gcm_ssp_findings"])==6
          assert len(d["gcm_grouped_descriptive_findings"])==3
          assert all(math.isfinite(x["relative_rmse_skill_pct"]) for x in d["arms"])
          print("Three-GCM descriptive replication summary:")
          print(json.dumps(d["descriptive_counts"],indent=2))
          print("Exact GCM/SSP scenario result:")
          print(json.dumps(d["gcm_ssp_findings"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v519-independent-three-GCM-SSP-matched-skill-comparison
          path: outputs/e1_cmip6_v519_three_GCM_frozen_SSP.*
          retention-days: 30
          if-no-files-found: warn
