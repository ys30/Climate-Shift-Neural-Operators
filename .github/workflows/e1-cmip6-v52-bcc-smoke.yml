name: E1 v5.2 BCC Historical-only noleap FNO U-Net smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v52-bcc-smoke-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v52-bcc-historical-smoke-once
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data/model dependencies and native-calendar BCC safety tests
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_cmip6_bcc_v51_historical.py tests/test_cmip6_bcc_v52_historical_fit.py
      - name: Download verified immutable BCC Historical-only noleap source artifact
        uses: actions/download-artifact@v4
        with:
          name: e1-v51-bcc-historical-noleap-training-cohort
          run-id: 45868844059
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/processed
      - name: Verify exact BCC source metadata and SHA before model fitting
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.export_cmip6_bcc_v51_historical import verify_saved_npz
          p=Path('data/processed/e1_cmip6_v51_bcc_historical.npz')
          verify_saved_npz(p)
          meta=json.loads(p.with_suffix('.json').read_text())
          assert meta['status']=='v51_bcc_historical_only_noleap_native_pairs_verified_no_training'
          assert meta['source_id']=='BCC-CSM2-MR' and meta['model_calendar'] in ('noleap','365_day')
          assert meta['train_count']==900 and meta['validation_count']==240
          assert meta['ssp_data_accessed'] is False
          assert hashlib.sha256(p.read_bytes()).hexdigest()==meta['input_npz_sha256']
          print('Frozen BCC noleap Historical dataset SHA',meta['input_npz_sha256'])
          PY
      - name: Fit standard MSE, fixed seed, 2-epoch FNO and U-Net with BCC native months
        run: |
          SOURCE_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('data/processed/e1_cmip6_v51_bcc_historical.json').read_text())['input_npz_sha256'])
          PY
          )"
          python scripts/fit_cmip6_bcc_v52_historical.py \
            --input data/processed/e1_cmip6_v51_bcc_historical.npz \
            --expected-sha "$SOURCE_SHA" \
            --output-dir outputs/e1_cmip6_v52_bcc_historical_smoke \
            --seed 11 --epochs 2 --tail-weight 0
      - name: Validate both checkpoints, data SHA and finite Historical validation metrics
        run: |
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          root=Path('outputs/e1_cmip6_v52_bcc_historical_smoke')
          meta=json.loads(Path('data/processed/e1_cmip6_v51_bcc_historical.json').read_text())
          out=json.loads((root/'bcc_historical_smoke.json').read_text())
          assert out['status']=='bcc_noleap_Historical_only_trained_no_future_SSP'
          assert out['source_npz_sha256']==meta['input_npz_sha256']
          assert out['calendar']=='noleap' and out['grid_shape']==[23,23]
          assert out['ssp_data_read'] is False
          assert (out['training_count'],out['validation_count'])==(900,240)
          assert set(out['models'])=={'fno','unet'}
          for name,model in out['models'].items():
              p=root/model['checkpoint']
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==model['checkpoint_sha256']
              assert model['best_epoch'] in (1,2)
              assert math.isfinite(model['validation_weighted']['rmse'])
              assert len(model['history'])==2
          print('BCC true native-calendar Historical-only FNO/U-Net smoke validated')
          PY
      - name: Archive only the BCC Historical trained model checkpoints and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-v52-bcc-historical-only-fno-unet-smoke
          path: outputs/e1_cmip6_v52_bcc_historical_smoke/
          retention-days: 30
          if-no-files-found: warn
