name: E1 v5.21 publishable three-GCM Results figures and CSV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v521-paper-figures-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v521-paper-figures
  cancel-in-progress: false

jobs:
  paper-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graph tools and audit provenance-sensitive figure tests
        run: |
          python -m pip install pytest matplotlib numpy
          python -m pytest tests/test_cmip6_v521_paper_results.py
      - name: Restore successful immutable v5.19 three-GCM SSP comparison
        uses: actions/download-artifact@v4
        with:
          name: e1-v519-independent-three-GCM-SSP-matched-skill-comparison
          run-id: 45908305246
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Render source-verified Results and two manuscript-quality PNG charts
        run: |
          python -m scripts.render_cmip6_v521_paper_results \
            --input inputs/e1_cmip6_v519_three_GCM_frozen_SSP.json \
            --output-dir outputs/e1_v521_publication_results
      - name: Confirm exact three-GCM figures and Results draft
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          d=Path("outputs/e1_v521_publication_results")
          assert (d/"fig_v521_fno_relative_rmse_skill.png").stat().st_size>8000
          assert (d/"fig_v521_recall_rmse_tradeoff.png").stat().st_size>8000
          with (d/"table_v521_three_GCM_SSP.csv").open() as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==6 and len({(r['gcm'],r['ssp']) for r in rows})==6
          assert {r['gcm'] for r in rows}=={"AWI","BCC","CAMS"}
          text=(d/"E1_v521_three_GCM_results_draft.md").read_text()
          assert "not six independent climate-model replications" in text
          print("Three-GCM Results and figures verified; descriptive only")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v521-three-GCM-results-draft-and-figures
          path: outputs/e1_v521_publication_results/
          retention-days: 30
          if-no-files-found: warn
