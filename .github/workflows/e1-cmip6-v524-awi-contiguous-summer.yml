name: E1 v5.24 AWI Historical-frozen contiguous 2050 summer event replication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v524-awi-summer-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v524-AWI-native-contiguous-summer
  cancel-in-progress: false

jobs:
  awi-contiguous-events:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test independent AWI Gregorian calendar and three-day same-pixel event rules
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_cmip6_v524_awi_contiguous_summer.py tests/test_cmip6_v520_cams_contiguous_summer.py tests/test_cmip6_v48_frozen_ssp.py
      - name: Restore AWI Historical-only source cohort
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v45-awi-historical-only-training-data
          run-id: 45857281051
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/processed
      - name: Restore independent AWI original 1x Historical checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v47-historical-weight-0
          run-id: 45861178303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen/weight_0
      - name: Restore independent AWI original 2x Historical checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v47-historical-weight-1
          run-id: 45861178303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen/weight_1
      - name: Restore independent AWI original 4x Historical checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v47-historical-weight-3
          run-id: 45861178303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen/weight_3
      - name: Audit all 18 AWI original Historical-only SHA checkpoints before SSP data
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.evaluate_cmip6_v48_frozen_ssp import read_frozen_checkpoints
          d=read_frozen_checkpoints(Path("frozen"),Path("data/processed/e1_cmip6_v45_awi_historical.npz"))
          assert len(d["models"])==18 and d["local_p95"].shape==(12,26,27)
          assert len(set(d["checkpoint_sha256_by_arm"].values()))==18
          print("Validated all 18 native AWI Historical-frozen checkpoints before future reads")
          PY
      - name: Calculate full 2050 summer contiguous 91 native target days for both AWI SSPs
        run: |
          python -m scripts.evaluate_cmip6_v524_awi_contiguous_summer \
            --historical data/processed/e1_cmip6_v45_awi_historical.npz \
            --arm-dir frozen \
            --manifest experiments/cmip6_v40_first_two_catalog_triples.json \
            --output outputs/e1_cmip6_v524_AWI_2050_contiguous_summer.json
      - name: Validate 91 target days, both SSPs and original 18 model checkpoints
        run: |
          python - <<'PY'
          import json,math
          from scripts.evaluate_cmip6_v524_awi_contiguous_summer import STATUS
          d=json.load(open("outputs/e1_cmip6_v524_AWI_2050_contiguous_summer.json"))
          assert d["status"]==STATUS and d["source_model"]=="AWI-CM-1-1-MR"
          assert d["ssp_fitted"] is False and len(d["checkpoint_sha"])==18
          assert set(d["scenarios"])=={"ssp245","ssp585"}
          for v in d["scenarios"].values():
            assert v["n_pairs"]==91
            assert v["source"]["n_bounded_regional_native_days_read"]==92
            assert v["source"]["native_calendar"]=="proleptic_gregorian"
            assert v["source"]["native_grid_shape"]==[26,27]
            for m in ("fno","unet"):
              assert set(v["models"][m])=={"0","1","3"}
              for w,row in v["models"][m].items():
                assert len(row["rmse_K"]["individual"])==3
                assert math.isfinite(row["rmse_K"]["mean"])
          print("AWI native Gregorian continuous SSP 2050 summer event pilot verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v524-AWI-2050-native-contiguous-summer-hot-event-forecast
          path: outputs/e1_cmip6_v524_AWI_2050_contiguous_summer.json
          retention-days: 30
          if-no-files-found: warn
