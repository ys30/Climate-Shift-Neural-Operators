name: E1 v5.26 three-GCM continuous heat-event manuscript figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v526-contiguous-figures-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v526-contiguous-manuscript
  cancel-in-progress: false

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source fidelity and figure generation using synthetic test-only data
        run: |
          python -m pip install pytest matplotlib numpy
          python -m pytest tests/test_cmip6_v526_contiguous_event_figures.py
      - name: Download independently successful v5.25 real three-GCM analysis
        uses: actions/download-artifact@v4
        with:
          name: e1-v525-three-independent-GCM-contiguous-2050-events-compare
          run-id: 45948547935
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Render three real manuscript figures and complete Results CSV
        run: |
          python -m scripts.render_cmip6_v526_contiguous_event_figures \
            --input inputs/v525_three_GCM_2050_contiguous_event_audit.json \
            --output-dir outputs/v526_paper_figures
      - name: Independently check real provenance and outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          p=Path("outputs/v526_paper_figures")
          assert len(list(p.glob("*.png")))==3
          assert all(f.stat().st_size>8000 for f in p.glob("*.png"))
          with (p/"table_v526_three_gcm_2050_continuous_events.csv").open() as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==6 and {r["gcm"] for r in rows}=={"AWI","BCC","CAMS"}
          text=(p/"E1_v526_manuscript_continuous_event_results.md").read_text()
          assert "not six independent GCM replicates" in text
          print("v5.26 real three-GCM manuscript figures provenance passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v526-three-GCM-contiguous-event-manuscript-figures
          path: outputs/v526_paper_figures/
          retention-days: 30
          if-no-files-found: warn
