name: E1 v5.28 three-GCM Pareto manuscript Figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v528-pareto-figures-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v528-Pareto-figures
  cancel-in-progress: false

jobs:
  pareto-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graphics dependencies and test Pareto plot provenance
        run: |
          python -m pip install pytest matplotlib numpy
          python -m pytest tests/test_cmip6_v528_pareto_manuscript.py
      - name: Retrieve independently validated source v5.27 Pareto archive
        uses: actions/download-artifact@v4
        with:
          name: e1-v527-three-GCM-2050-event-pareto-analysis
          run-id: 45951478573
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Generate reproducible three-GCM Pareto figures and paper results
        run: |
          python -m scripts.render_cmip6_v528_pareto_manuscript \
            --input inputs/v527_three_GCM_pareto_event_audit.json \
            --output-dir outputs/e1_v528_pareto_paper
      - name: Verify final figure data are 3 independent GCM with six paired SSP cells
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          p=Path("outputs/e1_v528_pareto_paper")
          images=list(p.glob("figure_v528_*.png"))
          assert len(images)==2 and all(x.stat().st_size>8000 for x in images)
          with (p/"table_v528_original_42_candidate_metrics.csv").open() as f:
            d=list(csv.DictReader(f))
          assert len(d)==42
          assert {(x["gcm"],x["scenario"]) for x in d}=={(g,s) for g in ("AWI","BCC","CAMS") for s in ("ssp245","ssp585")}
          assert sum(x["model"]=="persistence" for x in d)==6
          assert (p/"E1_v528_manuscript_Pareto_results.md").is_file()
          print("v5.28 complete original 42 candidate source-verified Pareto figures ready")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v528-three-GCM-Pareto-manuscript-figures
          path: outputs/e1_v528_pareto_paper/
          retention-days: 30
          if-no-files-found: warn
