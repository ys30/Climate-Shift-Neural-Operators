name: E1 v5.29 AWI independent 2040 contiguous summer held-out evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v529-awi-2040-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v529-AWI-2040-holdout
  cancel-in-progress: false

jobs:
  awi-2040:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 2040 preregistered temporal holdout and 2050 backward compatibility
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_cmip6_v529_awi_2040_holdout.py tests/test_cmip6_v524_awi_contiguous_summer.py tests/test_cmip6_v48_frozen_ssp.py
      - name: Restore unchanged AWI Historical-only native training cohort
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v45-awi-historical-only-training-data
          run-id: 45857281051
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/processed
      - name: Restore AWI original 1x Historical frozen checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v47-historical-weight-0
          run-id: 45861178303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen/weight_0
      - name: Restore AWI original 2x Historical frozen checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v47-historical-weight-1
          run-id: 45861178303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen/weight_1
      - name: Restore AWI original 4x Historical frozen checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v47-historical-weight-3
          run-id: 45861178303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen/weight_3
      - name: Verify Historical SHA-linked source and all 18 frozen AWI original checkpoints before reading 2040
        run: |
          python - <<'PY'
          from scripts.evaluate_cmip6_v529_awi_2040_contiguous_holdout import verified_frozen
          a=verified_frozen("data/processed/e1_cmip6_v45_awi_historical.npz","frozen")
          assert len(a["models"])==18 and a["local_p95"].shape==(12,26,27)
          assert len(set(a["checkpoint_sha256_by_arm"].values()))==18
          print("Original AWI 18 Historical-only checkpoint and regional geometry SHA provenance passed")
          PY
      - name: Evaluate AWI 2040 new independent time window (two SSP pathways)
        run: |
          python -m scripts.evaluate_cmip6_v529_awi_2040_contiguous_holdout \
            --historical data/processed/e1_cmip6_v45_awi_historical.npz \
            --arm-dir frozen \
            --manifest experiments/cmip6_v40_first_two_catalog_triples.json \
            --output outputs/e1_cmip6_v529_AWI_2040_contiguous_summer.json
      - name: Confirm 2040 not 2050, 91 native target days and no SSP fitting
        run: |
          python - <<'PY'
          import json
          from scripts.evaluate_cmip6_v529_awi_2040_contiguous_holdout import verify_output
          r=json.load(open("outputs/e1_cmip6_v529_AWI_2040_contiguous_summer.json"))
          verify_output(r)
          assert r["temporal_independence_from_prior_2050_event_analysis"] is True
          assert r["ssp_fitted"] is False
          assert r["selection_policy"].startswith("Original Historical-only selection")
          print("AWI 2040 independent summer time holdout and original frozen provenance verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v529-AWI-2040-new-temporal-holdout-contiguous-summer
          path: outputs/e1_cmip6_v529_AWI_2040_contiguous_summer.json
          retention-days: 30
          if-no-files-found: warn
