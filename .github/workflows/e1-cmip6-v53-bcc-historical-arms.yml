name: E1 v5.3 BCC noleap Historical-only frozen 3-seed 3-weight arms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v53-bcc-arms-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v53-bcc-historical-all-arms
  cancel-in-progress: false

jobs:
  bcc-frozen-arms:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tail_weight: [0, 1, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model runtime and frozen BCC noleap safety tests
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_cmip6_bcc_v51_historical.py tests/test_cmip6_bcc_v52_historical_fit.py tests/test_cmip6_bcc_v53_historical_arms.py
      - name: Recover immutable v5.1 verified BCC Historical-only data (no SSP source)
        uses: actions/download-artifact@v4
        with:
          name: e1-v51-bcc-historical-noleap-training-cohort
          run-id: 45868844059
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/processed
      - name: Verify exact source SHA and noleap month-fit before any model training
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.export_cmip6_bcc_v51_historical import verify_saved_npz
          p=Path('data/processed/e1_cmip6_v51_bcc_historical.npz')
          meta=json.loads(p.with_suffix('.json').read_text())
          verify_saved_npz(p)
          sha='a23260e8f14a23fb57483038bcd6ca03ba74c7944a48ba29d62bcc5bd354f452'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==sha==meta['input_npz_sha256']
          assert meta['model_calendar']=='noleap' and meta['native_grid_shape']==[23,23]
          assert meta['ssp_data_accessed'] is False
          assert set(meta['samples_per_train_month'].values())=={75}
          print('Frozen BCC Historical source and 75-per-month local P95 reference verified')
          PY
      - name: Run three seeds, 100 epochs, FNO/U-Net for predeclared BCC tail-weight arm
        run: |
          python scripts/run_cmip6_bcc_v53_historical_arms.py \
            --input data/processed/e1_cmip6_v51_bcc_historical.npz \
            --output-dir outputs/e1_v53_bcc_weight_${{ matrix.tail_weight }} \
            --tail-weight ${{ matrix.tail_weight }}
      - name: Audit all three saved seeds/architectures and source hashes
        run: |
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          weight=${{ matrix.tail_weight }}
          p=Path(f'outputs/e1_v53_bcc_weight_{weight}')
          r=json.loads((p/'bcc_arm_summary.json').read_text())
          assert r['status']=='BCC_historical_validation_only_full_frozen_arms_no_future_skill'
          assert r['source_npz_sha256']=='a23260e8f14a23fb57483038bcd6ca03ba74c7944a48ba29d62bcc5bd354f452'
          assert r['seeds']==[11,22,33] and r['epochs']==100 and r['tail_weight']==weight
          assert r['ssp_data_read'] is False
          assert set(r['models'])=={'fno','unet'}
          for m in r['models'].values():
              assert len(m['checkpoints'])==3
              for entry in m['checkpoints']:
                  chk=p/entry['file']
                  assert chk.is_file()
                  assert hashlib.sha256(chk.read_bytes()).hexdigest()==entry['sha256']
              for key in ('weighted_rmse_K','local_p95_recall','local_p95_precision'):
                  assert len(m[key]['individual'])==3
                  assert all(math.isfinite(v) for v in m[key]['individual'])
          print('BCC arm successful, no SSP target fitting or future checkpoint selection')
          PY
      - name: Archive complete noleap Historical-only training checkpoints (not SSP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-v53-bcc-frozen-historical-weight-${{ matrix.tail_weight }}
          path: outputs/e1_v53_bcc_weight_${{ matrix.tail_weight }}/
          if-no-files-found: warn
          retention-days: 30
