name: E1 v5.33 three GCM two-year manuscript result figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v533-two-year-manuscript-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v533-two-year-manuscript
  cancel-in-progress: false

jobs:
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test two-year source provenance and plot counterexample preservation
        run: |
          python -m pip install pytest matplotlib numpy
          python -m pytest tests/test_cmip6_v533_two_year_manuscript.py
      - name: Download immutable successful 2040/2050 three-GCM comparative results
        uses: actions/download-artifact@v4
        with:
          name: e1-v532-three-GCM-two-year-frozen-contiguous-events
          run-id: 46080073542
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Render real 2040/2050 paired-year figures and Results
        run: |
          python -m scripts.render_cmip6_v533_two_year_manuscript \
            --input inputs/v532_three_GCM_2040_2050_event_replication.json \
            --output-dir outputs/e1_v533_two_year_paper
      - name: Verify real figures 12 complete cells and the Precision exception
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("outputs/e1_v533_two_year_paper")
          figures=list(p.glob("figure_v533_*.png"))
          assert len(figures)==2 and all(z.stat().st_size>8000 for z in figures)
          with (p/"table_v533_12_two_year_event_cases.csv").open() as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==12
          assert {(r["gcm"],r["year"],r["scenario"]) for r in rows}=={
            (g,str(year),ssp) for g in ("AWI","BCC","CAMS")
            for year in (2040,2050) for ssp in ("ssp245","ssp585")}
          assert sum(float(r["four_x_minus_one_x_precision_pp"])>=0 for r in rows)==1
          text=(p/"E1_v533_two_year_three_GCM_results.md").read_text()
          assert "Precision counterexample" in text
          assert "12 independent climate-model replicates" in text
          print("v5.33 two-year figures and explicit precision exception validated")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v533-three-GCM-two-year-manuscript-figures
          path: outputs/e1_v533_two_year_paper/
          retention-days: 30
          if-no-files-found: warn
