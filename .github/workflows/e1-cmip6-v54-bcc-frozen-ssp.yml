name: E1 v5.4 BCC frozen Historical-to-SSP noleap blind evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v54-bcc-ssp-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v54-bcc-frozen-ssp
  cancel-in-progress: false

jobs:
  future-bcc:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native-calendar and frozen training libraries; enforce test design
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_cmip6_bcc_v54_frozen_ssp.py tests/test_cmip6_bcc_v53_historical_arms.py tests/test_cmip6_bcc_v52_historical_fit.py
      - name: Download previously verified BCC native Historical-only cohort
        uses: actions/download-artifact@v4
        with:
          name: e1-v51-bcc-historical-noleap-training-cohort
          run-id: 45868844059
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/processed
      - name: Download frozen BCC standard MSE checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-v53-bcc-frozen-historical-weight-0
          run-id: 45870654954
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen/weight_0
      - name: Download frozen BCC moderate hot-weight checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-v53-bcc-frozen-historical-weight-1
          run-id: 45870654954
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen/weight_1
      - name: Download frozen BCC strong hot-weight checkpoints
        uses: actions/download-artifact@v4
        with:
          name: e1-v53-bcc-frozen-historical-weight-3
          run-id: 45870654954
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: outputs/frozen/weight_3
      - name: Verify ALL eighteen BCC Historical-only checkpoint weights, exact native months and source hashes before SSP read
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.evaluate_cmip6_bcc_v54_frozen_ssp import inspect_frozen_sources
          source=Path('data/processed/e1_cmip6_v51_bcc_historical.npz')
          r=inspect_frozen_sources(source,Path('outputs/frozen'))
          assert len(r['checkpoints'])==18
          assert len(set(r['checkpoint_sha_by_model'].values()))==18
          assert r['p95'].shape==(12,23,23)
          print('BCC native n=18 Historical frozen source/checkpoint gate verified BEFORE any SSP data')
          PY
      - name: Blind BCC SSP245 and SSP585 2030/2050/2080 frozen model day+1 forecasts
        run: |
          python scripts/evaluate_cmip6_bcc_v54_frozen_ssp.py \
            --historical data/processed/e1_cmip6_v51_bcc_historical.npz \
            --arm-dir outputs/frozen \
            --manifest experiments/cmip6_v49_bcc_candidate_catalog.json \
            --output outputs/e1_cmip6_v54_bcc_frozen_ssp.json
      - name: Audit all scenario-year, model and seed results and future non-fitted status
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path('outputs/e1_cmip6_v54_bcc_frozen_ssp.json')
          d=json.loads(p.read_text())
          assert d['status']=='first_independent_GCM_BCC_Historical_to_sparse_SSP_frozen_forecast'
          assert d['ssp_used_for_fitting_or_checkpoint_selection'] is False
          assert d['native_calendar']=='noleap' and d['regional_grid_shape']==[23,23]
          assert len(d['checkpoint_sha'])==18
          assert set(d['scenario_results'])=={'ssp245','ssp585'}
          for scenario,sc in d['scenario_results'].items():
              groups=sc['scores']
              assert set(groups)=={'all','2030','2050','2080'}
              assert groups['all']['n_pairs']==72
              for year in ('2030','2050','2080'):
                  assert groups[year]['n_pairs']==24
              for scope,row in groups.items():
                  assert set(row['models'])=={'fno','unet'}
                  for name in ('fno','unet'):
                      assert set(row['models'][name])=={'0','1','3'}
                      for weight,metric in row['models'][name].items():
                          for label in ('weighted_rmse_K','local_p95_recall','local_p95_precision'):
                              assert len(metric[label]['individual'])==3
                              assert all(math.isfinite(v) for v in metric[label]['individual'])
          print('Complete BCC no-refit SSP assessment checked; no training on future data')
          PY
      - name: Archive only BCC derived forecast scores and frozen-source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-v54-bcc-first-frozen-ssp-results
          path: outputs/e1_cmip6_v54_bcc_frozen_ssp.json
          retention-days: 30
          if-no-files-found: warn
