name: E1 v5.7 sparse interyear change-error diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-v57-change-v1.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: e1-cmip6-v57-change-v1
  cancel-in-progress: false

jobs:
  change-error:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify interyear identity and frozen schema guards
        run: |
          python -m pip install pytest
          python -m pytest tests/test_cmip6_v57_sampled_change.py
      - name: Retrieve verified AWI v4.8 scores
        uses: actions/download-artifact@v4
        with:
          name: e1-cmip6-v48-first-frozen-ssp-sparse-evaluation
          run-id: 45864317174
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/awi
      - name: Retrieve verified BCC v5.4 scores
        uses: actions/download-artifact@v4
        with:
          name: e1-v54-bcc-first-frozen-ssp-results
          run-id: 45872811683
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs/bcc
      - name: Compute scenario-matched sampled interyear change error
        run: |
          python scripts/evaluate_cmip6_v57_sampled_change.py \
            --awi inputs/awi/e1_cmip6_v48_frozen_ssp_evaluation.json \
            --bcc inputs/bcc/e1_cmip6_v54_bcc_frozen_ssp.json \
            --output outputs/e1_cmip6_v57_sparse_year_change.json
      - name: Require complete 84 descriptive contrasts
        run: |
          python - <<'PY'
          import json
          d=json.load(open('outputs/e1_cmip6_v57_sparse_year_change.json'))
          assert len(d["records"])==84
          assert d["gcm_replication_count"]==2
          assert d["status"]=="v57_sparse_interyear_forecast_change_error_no_forced_warming_claim"
          print("84 change-error comparisons verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-v57-sparse-scenario-year-temperature-change-error
          path: outputs/e1_cmip6_v57_sparse_year_change.json
          retention-days: 30
          if-no-files-found: warn
