name: E1 CMIP6 Zarr actual metadata access probe (two model trios)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-cmip6-zarr-probe-v1.txt'

permissions:
  contents: read

concurrency:
  group: e1-cmip6-zarr-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata reader and run strict unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install "xarray" "zarr<4" "gcsfs" "numpy" "pytest"
          python -m pytest tests/test_cmip6_zarr_probe.py tests/test_cmip6_catalog.py
      - name: Check actual public CMIP6 Zarr stores, zero climate-field reads
        run: |
          python scripts/probe_cmip6_zarr.py \
            --manifest experiments/cmip6_v40_first_two_catalog_triples.json \
            --output outputs/e1_cmip6_v41_zarr_metadata_probe.json \
            --max-models 2
      - name: Guard truthfulness of metadata gate and print any incompatibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("outputs/e1_cmip6_v41_zarr_metadata_probe.json").read_text())
          assert d["status"]=="actual_public_zarr_metadata_probe_no_forecast_or_future_skill"
          assert d["examined_model_count"]==2
          assert all(len(m["stores"])==3 for m in d["models"])
          assert 0<=d["complete_trios"]<=2
          print(json.dumps({"complete_trios":d["complete_trios"],
              "models":[{"name":m["source_id"],"matched":m["matched_trio_accessible_and_compatible"],
                         "diagnostics":{k:(v["status"],v.get("error","")) for k,v in m["stores"].items()}}
                        for m in d["models"]]},indent=2))
          # Unavailable data must be reported explicitly, never replaced with assumed success.
          PY
      - name: Archive small metadata diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-cmip6-v41-zarr-access-schema
          path: outputs/e1_cmip6_v41_zarr_metadata_probe.json
          retention-days: 30
          if-no-files-found: warn
