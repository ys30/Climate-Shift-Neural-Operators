name: E1 fresh 2015-2017 heldout confirmation of three tail weights

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/triggers/e1-tail-fresh-2015-2017-v1.txt'

permissions:
  contents: read

concurrency:
  group: e1-fresh-years-2015-2017-tail-3arm
  cancel-in-progress: false

jobs:
  fresh-tail-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact code and test tail loss and independent year reporting
        run: |
          python -m pip install -e '.[test,torch,era5]'
          python -m pytest tests/test_tail_weighted_e1.py tests/test_multiyear_summary.py tests/test_heldout_year_metrics.py
      - name: Extract untouched 2015–2017 plus frozen 2008–2011 train/validation cohort
        run: |
          python scripts/export_wb2_multiyear.py \
            --years 2008 2009 2010 2011 2015 2016 2017 \
            --max-per-month 24 --stride 4 \
            --output data/processed/e1_fresh_2015_2017.npz
          python scripts/check_e1_coverage.py \
            --input data/processed/e1_fresh_2015_2017.npz \
            --metadata data/processed/e1_fresh_2015_2017.json \
            --years 2008 2009 2010 2011 2015 2016 2017 \
            --min-per-month 20 --output outputs/e1_fresh_year_coverage.json
      - name: Run all frozen candidate loss weights with same 3 seeds and epoch budget
        run: |
          for weight in 0 1 3; do
            python scripts/run_e1_multiseed.py \
              --input data/processed/e1_fresh_2015_2017.npz \
              --output-dir "outputs/e1_fresh_weight_${weight}" \
              --train-end 2010 --val-end 2011 --test-end 2017 \
              --seeds 11 22 33 --epochs 100 --width 8 --modes 4 \
              --tail-weight "$weight" --require-pair-times
          done
      - name: Validate untouched heldout cohorts; report all candidate arms transparently
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected={'train':864,'validation':288,'test':864}
          summary={}
          for weight in (0,1,3):
              folder=Path(f'outputs/e1_fresh_weight_{weight}')
              s=json.loads((folder/'seed_summary.json').read_text())
              assert s['tail_weight']==weight
              assert s['seeds']==[11,22,33]
              assert s['split_isolation']['status']=='passed'
              assert s['heldout_years']==['2015','2016','2017']
              assert s['area_weighting_status'].startswith('cos(latitude)')
              assert s['seasonal_local_p95_definition']['status']=='available_training_only'
              summary[str(weight)]={'input_sha256':s['input_sha256'],'models':{}}
              for seed in (11,22,33):
                  d=json.loads((folder/f'seed_{seed}.json').read_text())
                  assert d['n_samples']==expected
                  assert d['hyperparameters']['tail_weight']==weight
                  assert d['hyperparameters']['epochs']==100
                  assert d['conditional_skill_reference']=='train_only_month_local_mean_std'
                  for model in ('fno','unet'):
                      assert len(d['diagnostics'][model]['history'])==100
                      assert set(d['per_test_year_anomaly_bin_errors'][model])=={'2015','2016','2017'}
              for model in ('fno','unet'):
                  rows=[json.loads((folder/f'seed_{seed}.json').read_text()) for seed in (11,22,33)]
                  summary[str(weight)]['models'][model]={
                      'weighted_rmse':s['models'][model]['weighted_rmse'],
                      'local_p95_recall':s['models'][model]['monthly_local_hot_recall'],
                      'local_p95_precision_by_seed':[
                          r['seasonal_local_hot_diagnostics'][model]['hot_precision'] for r in rows
                      ],
                      'local_p95_predicted_fraction_by_seed':[
                          r['seasonal_local_hot_diagnostics'][model]['predicted_hot_fraction'] for r in rows
                      ],
                      'per_year':{
                          year:{
                              'weighted_rmse':s['per_test_year_models'][year][model]['area_weighted_rmse'],
                              'local_p95_recall':s['per_test_year_models'][year][model]['monthly_local_hot_recall'],
                              'hot_z_gt_2_rmse_by_seed':[
                                  r['per_test_year_anomaly_bin_errors'][model][year]['bins']['hot_gt_p2']['weighted_rmse_K']
                                  for r in rows
                              ],
                          } for year in ('2015','2016','2017')
                      },
                  }
              print('weight',weight,{model:(
                  summary[str(weight)]['models'][model]['weighted_rmse']['mean'],
                  summary[str(weight)]['models'][model]['local_p95_recall']['mean']
              ) for model in ('fno','unet')})
          assert len({entry['input_sha256'] for entry in summary.values()})==1
          Path('outputs/e1_fresh_threearm_results.json').write_text(
              json.dumps({'status':'fresh_heldout_confirmation_not_CMIP6_climate_shift',
                          'heldout_years':[2015,2016,2017],
                          'frozen_train_years':[2008,2009,2010],
                          'frozen_validation_year':2011,
                          'candidate_tail_weights':[0,1,3],
                          'data_sha256':summary['0']['input_sha256'],
                          'arms':summary},indent=2,allow_nan=False)+'\n'
          )
          PY
      - name: Archive new-year results and metadata only; no raw ERA5 grids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-fresh-2015-2017-three-tail-weights
          path: |
            data/processed/e1_fresh_2015_2017.json
            outputs/e1_fresh_year_coverage.json
            outputs/e1_fresh_threearm_results.json
            outputs/e1_fresh_weight_*/*.json
          retention-days: 14
          if-no-files-found: warn
