name: Synthetic model smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/synthetic_smoke.py'
      - 'tests/test_fno.py'
      - 'pyproject.toml'
      - '.github/workflows/synthetic-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,torch]'
      - run: python -m pytest tests/test_fno.py
      - run: python scripts/synthetic_smoke.py --steps 10
