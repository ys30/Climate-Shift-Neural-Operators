name: E1 WeatherBench 2 access probe

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_wb2_access.py
      - .github/workflows/wb2-access-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal Zarr reader
        run: python -m pip install "numpy>=1.24,<3" "xarray>=2024.1" "zarr>=2.16,<4" "gcsfs>=2024.1"
      - name: Probe public ERA5 metadata and tiny field
        run: python scripts/probe_wb2_access.py --output outputs/wb2_access_probe.json
      - name: Upload diagnostic regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb2-access-probe
          path: outputs/wb2_access_probe.json
          if-no-files-found: warn
          retention-days: 14
