[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-shift-neural-operators"
version = "0.3.0"
description = "Leakage-aware climate-shift evaluation utilities"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
torch = ["torch>=2.2,<3"]
era5 = ["xarray>=2024.1", "zarr>=2.16,<4", "gcsfs>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
